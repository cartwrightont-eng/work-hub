services:
  - type: web
    name: work-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app.db import init_db; init_db()" && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false             # paste the Neon connection string (with sslmode=require)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: db               # uploads are kept in Postgres; the free plan has no persistent disk
      - key: PROXY_HOPS
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.3
