<div class="card" id="jc" hidden><h2>Team join code</h2>
<p class="mute">Share this code with your team. They sign up at <b id="jcurl"></b> with the organisation name and this code, and join as members.</p>
<div class="row"><b id="jcode" class="big" style="letter-spacing:.1em"></b>
<button class="ghost" id="jccopy" type="button">Copy</button><button class="ghost" id="jcnew" type="button">Generate a new code</button></div>
<p id="jcmsg" class="mute"></p></div>
<script>(async()=>{const c=document.getElementById('jc');
const r=await hub.call('GET','/api/join-code');if(!r.ok)return;c.hidden=false;
document.getElementById('jcurl').textContent=location.origin+'/signup';
const show=d=>document.getElementById('jcode').textContent=d.code;show(r.data);
document.getElementById('jccopy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('jcode').textContent);hub.say(jcmsg,'Copied.')};
document.getElementById('jcnew').onclick=async()=>{if(!confirm('The old code will stop working. Continue?'))return;
const n=await hub.call('POST','/api/join-code/regenerate');if(n.ok){show(n.data);hub.say(jcmsg,'New code created.')}else hub.say(jcmsg,'Could not create a new code.',true)};})();</script>
