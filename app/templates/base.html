<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} · Work Hub</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2521;--mute:#4a5651;--acc:#1f6f5c;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--card:#202623;--ink:#eef2ef;--mute:#b4beb9;--acc:#5fc4a8;--line:#39413d}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav a{color:var(--ink);padding:6px 10px;border-radius:6px;text-decoration:none;border:1px solid var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.mute{color:var(--mute);font-size:.85rem}h1{font-size:1.4rem;margin:.2rem 0}h2{font-size:1rem;margin:0 0 6px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}.wrap{overflow-x:auto}
.note{border-left:4px solid var(--acc);padding:8px 12px;background:var(--card);margin:12px 0}
.pf{display:flex;gap:8px;align-items:center;margin:8px 0}select,button{padding:7px;font:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:6px;cursor:pointer}
a{color:var(--acc)}
.grid>.card{margin-top:0}.big{font-size:2rem;font-weight:700}
nav a[aria-current=page]{background:var(--acc);color:#fff;border-color:var(--acc)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-items:start;margin-top:12px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.col h2{display:flex;justify-content:space-between}
.dcard{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;background:var(--bg)}
.dcard a.t{font-weight:600;color:var(--ink);text-decoration:none;display:block}.dcard a.t:hover{text-decoration:underline}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.78rem;color:var(--mute)}
.badge.warn{border-color:#b8671f;color:#b8671f}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
input,textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px}legend{padding:0 6px;color:var(--mute);font-size:.85rem}
.sizes{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sizes label{border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;display:block}
.sizes input{margin-right:6px}.sizes label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
select{max-width:100%}.chartcard h2{min-height:2.6em}.err{color:#b3261e}.ok{color:var(--acc)}</style></head><body>
<nav aria-label="Main">{% for label, href in nav %}<a href="{{ href }}"{% if request.path == href or (href != '/' and request.path.startswith(href + '/') and href != '/people') %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav><main>{% block body %}{% endblock %}</main>
<script>window.hub={csrf:()=>(document.cookie.match(/csrf_access_token=([^;]+)/)||[])[1],
async call(method,url,body){const o={method,headers:{'X-CSRF-TOKEN':hub.csrf()}};
if(body instanceof FormData)o.body=body;else if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
const r=await fetch(url,o);let data={};try{data=await r.json();}catch(e){}return{ok:r.ok,status:r.status,data};},
say(el,text,bad){el.textContent=text;el.className=bad?'err':'ok';}};</script></body></html>
